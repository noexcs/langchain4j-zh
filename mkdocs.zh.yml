theme:
  name: material
  language: zh
  logo: img/logo.svg
  font: false
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/langchain4j/langchain4j
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/langchain4j
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/JzTFvyjG6R
    - icon: fontawesome/brands/stack-overflow
      link: https://stackoverflow.com/questions/tagged/langchain4j

extra_css:
  - css/custom.css

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

