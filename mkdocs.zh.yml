site_name: LangChain4j 中文文档
site_description: LangChain4j 是一个让 Java 应用程序使用 LLM 的开源 Java 框架，提供统一的 API 接入各大 LLM 提供商与向量存储，内置 AI 服务、智能体、工具调用与 RAG 能力。本文档为官方英文文档（docs.langchain4j.dev）的简体中文翻译版。
repo_url: https://github.com/noexcs/langchain4j-zh
site_url: https://noexcs.github.io/langchain4j-zh/
edit_uri: ''
use_directory_urls: false
docs_dir: docs-zh
site_dir: site-zh
strict: false

